<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form | SCHOOL-DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 form-card">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0">Student Enrollment Form</h5>
                    <span class="badge bg-light text-dark">SCHOOL-DB / STUDENT-TABLE</span>
                </div>
                <div class="card-body p-4">
                    <form id="studentForm" onsubmit="return false;">
                        <div class="mb-3">
                            <label for="rollNo" class="form-label fw-semibold">Roll No. <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="rollNo" placeholder="Enter Roll No. and press Enter">
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter Full Name" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="studentClass" class="form-label fw-semibold">Class <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="studentClass" placeholder="e.g., 10-A" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="birthDate" class="form-label fw-semibold">Birth Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="birthDate" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label fw-semibold">Address <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="address" placeholder="Enter Residential Address" disabled>
                        </div>
                        <div class="mb-4">
                            <label for="enrollmentDate" class="form-label fw-semibold">Enrollment Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="enrollmentDate" disabled>
                        </div>
                        <div class="d-flex justify-content-center gap-3">
                            <button type="button" class="btn btn-success px-4" id="saveBtn" onclick="saveData()" disabled>Save</button>
                            <button type="button" class="btn btn-warning px-4" id="updateBtn" onclick="updateData()" disabled>Update</button>
                            <button type="button" class="btn btn-secondary px-4" id="resetBtn" onclick="resetForm()" disabled>Reset</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/index.js"></script>
</body>
</html>
